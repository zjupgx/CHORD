[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chord"
version = "0.1.0"
description = "Cross-species prototype-based single-cell integration and cell-type relationship inference"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Yitao Lin" }
]
license = { text = "MIT" }

dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
  "seaborn",
  "scikit-learn",
  "statsmodels",
  "torch",
  "scanpy",
  "anndata",
  "PyYAML",
  "scib",
  "requests",
  "networkx"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
