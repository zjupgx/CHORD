[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chord"
version = "0.1.0"
description = "CHORD (Cross-species Hierarchical Orthologous Relationship Discovery) is a cross-species integration framework for joint representation learning across gene, cell and cell-type levels."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Yitao Lin" }
]
license = { text = "MIT" }

dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
  "seaborn",
  "scikit-learn",
  "statsmodels",
  "torch",
  "scanpy",
  "anndata",
  "PyYAML",
  "scib",
  "requests",
  "networkx"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
