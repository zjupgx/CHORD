model:
  embed_dim: 128
  hidden_dim: 128

training:
  seed: 42
  batch_size: 256
  device: auto

  stage1:
    lambda_g: 1.0
    lambda_c: 0
    temperature: 0.1
    lr: 0.001
    epochs: 100

  stage2:
    lambda_g: 10.0
    lambda_c: 0.1
    temperature: 0.1
    lr: 0.005
    epochs: 200

data:
  n_HVG: 2000
  cpm: null

  species:
    - name: fish
      h5ad: /path/to/fish.h5ad
      label_col: cell_type
      is_preprocessed: true

    - name: frog
      h5ad: /path/to/frog.h5ad
      label_col: cell_type
      is_preprocessed: true

  homology:
    - species1: fish
      species2: frog
      path: /path/to/fish_frog_homology.csv

output:
  outdir: results
  model_filename: fish_frog.pth